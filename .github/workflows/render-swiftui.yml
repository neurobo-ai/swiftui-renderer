name: Render SwiftUI to PNG

on:
  repository_dispatch:
    types: [render-swiftui]
  workflow_dispatch:
    inputs:
      swift_code_b64:
        description: 'Base64-encoded SwiftUI code'
        required: true
      root_view:
        description: 'Name of the View struct to launch (default ContentView)'
        default: 'ContentView'

concurrency:
  group: render-swiftui-${{ github.event.client_payload.root_view || inputs.root_view || 'ContentView' }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Decode input
        id: decode
        run: |
          if [ -n "${{ github.event.client_payload.swift_code_b64 }}" ]; then
            CODE_B64="${{ github.event.client_payload.swift_code_b64 }}"
            JOB_ID="${{ github.event.client_payload.job_id }}"
            ROOT_VIEW="${{ github.event.client_payload.root_view }}"
          else
            CODE_B64="${{ inputs.swift_code_b64 }}"
            JOB_ID="manual-$(date +%s)"
            ROOT_VIEW="${{ inputs.root_view }}"
          fi
          [ -z "$ROOT_VIEW" ] && ROOT_VIEW="ContentView"
          echo "job_id=$JOB_ID" >> $GITHUB_OUTPUT
          echo "root_view=$ROOT_VIEW" >> $GITHUB_OUTPUT
          mkdir -p Runner output
          echo "$CODE_B64" | base64 -d > Runner/UserView.swift
          echo "Build not yet started" > output/build-error.txt

      - name: Cache xcodegen
        id: cache-xcodegen
        uses: actions/cache@v4
        with:
          path: |
            /opt/homebrew/Cellar/xcodegen
            /opt/homebrew/bin/xcodegen
          key: xcodegen-v245-${{ runner.os }}

      # 缓存 Xcode DerivedData：SwiftUI/Foundation 等系统库的 module cache
      # 不同 root_view 各自一份；同 root_view 内连续运行能命中
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/ModuleCache.noindex
          key: deriveddata-v4-${{ runner.os }}-${{ steps.decode.outputs.root_view }}
          restore-keys: |
            deriveddata-v4-${{ runner.os }}-

      - name: Install xcodegen (if not cached)
        if: steps.cache-xcodegen.outputs.cache-hit != 'true'
        run: brew install xcodegen > /dev/null

      - name: Generate Xcode project
        run: |
          ROOT_VIEW="${{ steps.decode.outputs.root_view }}"
          cat > Runner/RunnerApp.swift <<EOF
          import SwiftUI

          @main
          struct RunnerApp: App {
              var body: some Scene {
                  WindowGroup {
                      $ROOT_VIEW()
                  }
              }
          }
          EOF

          cat > project.yml <<'EOF'
          name: Runner
          options:
            bundleIdPrefix: com.swiftui.renderer
            deploymentTarget:
              iOS: '17.0'
            xcodeVersion: '15.0'
          targets:
            Runner:
              type: application
              platform: iOS
              sources: [Runner]
              info:
                path: Runner/Info.plist
                properties:
                  UILaunchScreen: {}
          EOF
          xcodegen generate

      # 并发：booting simulator 和 build 同时启
      - name: Boot simulator (async)
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          for runtime, devs in d['devices'].items():
              if 'iOS' not in runtime: continue
              for x in devs:
                  if x.get('isAvailable') and 'iPhone' in x['name']:
                      print(x['udid']); sys.exit(0)
          ")
          echo "DEVICE_ID=$DEVICE_ID" >> $GITHUB_ENV
          xcrun simctl boot "$DEVICE_ID" > /dev/null 2>&1 &

      - name: Build app (fast)
        id: build
        continue-on-error: true
        run: |
          set +e
          # 命令行传 build settings 不破坏 xcodegen 默认配置：
          # COMPILER_INDEX_STORE_ENABLE=NO 关索引
          # SWIFT_COMPILATION_MODE=singlefile 增量编译更快
          xcodebuild -project Runner.xcodeproj -scheme Runner \
            -destination "id=$DEVICE_ID" \
            -derivedDataPath build \
            -disableAutomaticPackageResolution \
            -skipPackagePluginValidation \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_COMPILATION_MODE=singlefile \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            build 2>&1 > build.log
          BUILD_EXIT=$?
          echo "build_exit=$BUILD_EXIT" >> $GITHUB_OUTPUT

          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "── Build FAILED (exit=$BUILD_EXIT) ──" > output/build-error.txt
            grep -E "(error:|warning:|BUILD FAILED)" build.log | head -50 >> output/build-error.txt || true
            echo "" >> output/build-error.txt
            echo "── Last 30 lines of build.log ──" >> output/build-error.txt
            tail -30 build.log >> output/build-error.txt
            cat output/build-error.txt
          else
            rm -f output/build-error.txt
          fi

      - name: Install & launch app & screenshot
        if: steps.build.outputs.build_exit == '0'
        run: |
          xcrun simctl bootstatus "$DEVICE_ID" -b
          APP_PATH=$(find build -name "Runner.app" -type d | head -1)
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" com.swiftui.renderer.Runner
          sleep 2
          xcrun simctl io "$DEVICE_ID" screenshot output/screen.png

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-${{ steps.decode.outputs.job_id }}
          path: output/
          retention-days: 1
